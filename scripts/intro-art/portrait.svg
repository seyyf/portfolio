      <rect y="650" width="900" height="10" fill="#000"/>
      <rect y="690" width="900" height="14" fill="#000"/>
      <rect y="732" width="900" height="18" fill="#000"/>
      <rect y="776" width="900" height="22" fill="#000"/>
    </mask>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <g mask="url(#stripes)">
    <circle cx="450" cy="560" r="320" fill="url(#sun)"/>
  </g>

