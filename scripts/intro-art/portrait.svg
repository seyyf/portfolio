    <g transform="translate(69 60)">
      <path d="M0 0 C -18 -14, -44 -14, -60 4 C -40 -4, -20 -2, 0 4 Z"/>
      <path d="M0 0 C -10 -22, -30 -36, -52 -34 C -32 -26, -16 -14, -2 2 Z"/>
