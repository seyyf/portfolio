<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <!-- Original placeholder portrait for this site: a stylized silhouette in sunset light. Replace with a real photo. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1200">
      <stop offset="0" stop-color="#1d0f3d"/>
      <stop offset="0.5" stop-color="#5b2a9e"/>
      <stop offset="1" stop-color="#c2337f"/>
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="820">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="lens" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="652">
      <stop offset="0" stop-color="#5b2a9e"/>
      <stop offset="0.5" stop-color="#ff4fa3"/>
      <stop offset="0.56" stop-color="#ffc94a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <mask id="stripes">
