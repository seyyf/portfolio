  <ellipse cx="318" cy="650" rx="20" ry="36" fill="#2a2240"/>
  <ellipse cx="582" cy="650" rx="20" ry="36" fill="#2a2240"/>
  <ellipse cx="450" cy="640" rx="134" ry="170" fill="#2a2240"/>
