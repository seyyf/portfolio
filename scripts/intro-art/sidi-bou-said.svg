<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <!-- Original illustration for this site: white-and-blue houses evoking Sidi Bou Said at sunset. -->
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="720">
      <stop offset="0" stop-color="#25124a"/>
      <stop offset="0.38" stop-color="#6a2fa0"/>
      <stop offset="0.72" stop-color="#e0468f"/>
      <stop offset="1" stop-color="#ff9a52"/>
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="488" x2="0" y2="632">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="1" stop-color="#ff6f8f"/>
    </linearGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="720" x2="0" y2="800">
      <stop offset="0" stop-color="#6b2a7a"/>
      <stop offset="1" stop-color="#1c2b55"/>
    </linearGradient>
    <linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="0" y1="500" x2="900" y2="1200">
      <stop offset="0" stop-color="#fff4ee"/>
      <stop offset="1" stop-color="#f1dde3"/>
    </linearGradient>
  </defs>

  <rect width="900" height="760" fill="url(#sky)"/>
  <circle cx="300" cy="560" r="72" fill="url(#sun)"/>
  <rect y="718" width="900" height="90" fill="url(#sea)"/>
  <rect y="716" width="900" height="3" fill="#ffe6a8" opacity="0.7"/>
  <g fill="#ffc94a" opacity="0.7">
    <rect x="660" y="728" width="120" height="4" rx="2"/>
    <rect x="680" y="744" width="80" height="3" rx="1.5"/>
    <rect x="696" y="760" width="48" height="3" rx="1.5"/>
  </g>

  <!-- palm behind the houses -->
  <g fill="#3b1a5e" transform="translate(-60 120) scale(2.7)">
    <path d="M58 218 C 61.6 170, 72.8 120, 78 62 L 84 62 C 78.8 122, 69.6 172, 66 218 Z"/>
    <g transform="translate(81 60)">
      <path d="M0 0 C -18 -14, -44 -14, -60 4 C -40 -4, -20 -2, 0 4 Z"/>
      <path d="M0 0 C -10 -22, -30 -36, -52 -34 C -32 -26, -16 -14, -2 2 Z"/>
      <path d="M0 0 C 4 -24, -2 -44, -14 -56 C -4 -38, -2 -20, 2 0 Z"/>
      <path d="M0 0 C 16 -20, 36 -30, 56 -26 C 36 -18, 18 -8, 2 2 Z"/>
      <path d="M0 0 C 20 -8, 44 -4, 60 12 C 40 6, 20 4, 0 4 Z"/>
      <path d="M0 2 C 10 10, 18 26, 20 42 C 12 28, 4 16, -2 6 Z"/>
    </g>
  </g>

  <!-- back house with dome and a blue lattice window -->
  <rect x="430" y="540" width="470" height="660" fill="url(#wall)"/>
  <rect x="424" y="528" width="482" height="16" fill="#ffffff"/>
  <path d="M560 528 A90 90 0 0 1 740 528 Z" fill="#fff4ee"/>
  <path d="M650 438 L650 420" stroke="#f1dde3" stroke-width="6"/>
  <circle cx="650" cy="416" r="7" fill="#fff4ee"/>
  <path d="M740 528 A90 90 0 0 0 690 446 A110 110 0 0 1 710 528 Z" fill="#e7cfdc"/>
  <g>
    <rect x="608" y="660" width="196" height="16" fill="#2f6db5"/>
    <rect x="620" y="676" width="172" height="190" fill="#2f6db5"/>
    <g stroke="#1f4f8c" stroke-width="5">
      <path d="M620 714H792M620 752H792M620 790H792M620 828H792"/>
      <path d="M663 676V866M706 676V866M749 676V866"/>
    </g>
    <rect x="612" y="866" width="188" height="12" fill="#2f6db5"/>
  </g>
  <path d="M690 1200 V990 a60 60 0 0 1 120 0 V1200 Z" fill="#2f6db5"/>
  <path d="M704 1200 V994 a46 46 0 0 1 92 0 V1200 Z" fill="none" stroke="#1f4f8c" stroke-width="5"/>

  <!-- front house -->
  <path d="M520 640 L580 612 L580 1200 L520 1200 Z" fill="#d9c3d6"/>
  <rect x="0" y="640" width="520" height="560" fill="url(#wall)"/>
  <rect x="-6" y="628" width="532" height="18" fill="#ffffff"/>
  <path d="M520 646 L580 618 L580 628 L526 652 Z" fill="#efe2ea"/>

  <!-- arched blue window -->
  <path d="M370 880 V790 a45 45 0 0 1 90 0 V880 Z" fill="#2f6db5"/>
  <path d="M415 745 V880 M370 820 H460" stroke="#1f4f8c" stroke-width="5"/>
  <rect x="362" y="880" width="106" height="10" fill="#2f6db5"/>

  <!-- studded blue door -->
  <path d="M128 1200 V950 a86 86 0 0 1 172 0 V1200 Z" fill="#1f4f8c"/>
  <path d="M142 1200 V954 a72 72 0 0 1 144 0 V1200 Z" fill="#2f6db5"/>
  <g fill="#f3c969">
    <circle cx="214" cy="930" r="5"/>
    <circle cx="184" cy="966" r="5"/><circle cx="244" cy="966" r="5"/>
    <circle cx="164" cy="1010" r="5"/><circle cx="214" cy="1010" r="5"/><circle cx="264" cy="1010" r="5"/>
    <circle cx="184" cy="1054" r="5"/><circle cx="244" cy="1054" r="5"/>
    <circle cx="214" cy="1098" r="5"/>
    <circle cx="164" cy="1140" r="5"/><circle cx="264" cy="1140" r="5"/>
  </g>

  <!-- bougainvillea over the wall -->
  <g fill="#2e5d4b">
    <ellipse cx="40" cy="650" rx="16" ry="8"/><ellipse cx="120" cy="640" rx="14" ry="7"/><ellipse cx="210" cy="652" rx="16" ry="8"/>
    <ellipse cx="300" cy="644" rx="12" ry="6"/><ellipse cx="80" cy="700" rx="12" ry="6"/><ellipse cx="170" cy="720" rx="14" ry="7"/>
    <ellipse cx="30" cy="770" rx="12" ry="6"/>
  </g>
  <g fill="#ff4fa3">
    <circle cx="20" cy="630" r="20"/><circle cx="60" cy="620" r="18"/><circle cx="100" cy="634" r="16"/><circle cx="146" cy="624" r="20"/>
    <circle cx="190" cy="636" r="14"/><circle cx="232" cy="628" r="18"/><circle cx="276" cy="636" r="13"/><circle cx="318" cy="630" r="10"/>
    <circle cx="44" cy="672" r="16"/><circle cx="96" cy="684" r="14"/><circle cx="140" cy="668" r="12"/><circle cx="196" cy="690" r="13"/>
    <circle cx="20" cy="720" r="14"/><circle cx="66" cy="736" r="11"/><circle cx="130" cy="726" r="9"/><circle cx="20" cy="790" r="10"/>
  </g>
  <g fill="#c42d7a">
    <circle cx="38" cy="642" r="9"/><circle cx="122" cy="650" r="8"/><circle cx="210" cy="618" r="8"/><circle cx="256" cy="646" r="7"/>
    <circle cx="70" cy="696" r="8"/><circle cx="172" cy="700" r="7"/><circle cx="40" cy="752" r="7"/>
  </g>
  <g fill="#ff9ccb">
    <circle cx="70" cy="610" r="6"/><circle cx="160" cy="612" r="6"/><circle cx="240" cy="616" r="5"/><circle cx="110" cy="672" r="5"/>
  </g>

  <!-- street -->
  <rect y="1176" width="900" height="24" fill="#cdb7c8"/>
</svg>
